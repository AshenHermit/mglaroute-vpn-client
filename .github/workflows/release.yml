name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      # Fail before building/publishing if the tag and the packaged version drift.
      - name: Guard tag matches tauri.conf.json version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $expected = "v$version"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "Release tag '$env:RELEASE_TAG' does not match tauri.conf.json version $version (expected '$expected')"
          }

      - run: pnpm binaries:fetch
        env:
          XRAY_VERSION: ${{ vars.XRAY_VERSION }}

      - run: pnpm binaries:verify

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: mglaroute v__VERSION__
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
